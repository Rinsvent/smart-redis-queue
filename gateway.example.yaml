# Пример: manager gateway --config gateway.yaml
listen: "127.0.0.1:50051"   # gRPC
http: "127.0.0.1:50052"     # HTTP data-plane + ops
dump: "/var/lib/srq/gateway.dump"
# skip_persist_check: false
# stats_retention: "1h"     # централизованный writeback g/a/r в Redis

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

