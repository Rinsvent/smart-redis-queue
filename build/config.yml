# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Rinsvent"
  productName: "Smart Redis Queue"
  productIdentifier: "com.rinsvent.smartredisqueue"
  description: "Desktop manager for Smart Redis Queue"
  copyright: "(c) Rinsvent"
  comments: "Smart Redis Queue manager"
  version: "1.0.0"

# Android package id (also used by android Taskfile APP_ID)
APP_ID: com.rinsvent.smartredisqueue

# iOS build configuration (overrides info.* when set)
ios:
  bundleID: "com.rinsvent.smartredisqueue"
  displayName: "Smart Redis Queue"
  version: "1.0.0"
  company: "Rinsvent"
  comments: "Smart Redis Queue manager"
  minIOSVersion: "15.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations: []

other: []
