name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-linux:
    name: Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/desktopui/frontend/package-lock.json

      - name: Install GTK3 / WebKit (Wails v3 legacy gtk3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        working-directory: internal/desktopui/frontend
        run: npm ci && npm run build

      - name: Build CLI
        run: |
          go build -ldflags "-s -w" \
            -o smart-redis-queue-cli-linux-amd64 \
            ./cmd/manager

      - name: Build desktop (opens UI on launch)
        env:
          CGO_ENABLED: '1'
        run: |
          go build -tags wails,production,gtk3 \
            -ldflags "-s -w" \
            -o smart-redis-queue-desktop-linux-amd64 \
            ./cmd/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-amd64
          path: |
            smart-redis-queue-cli-linux-amd64
            smart-redis-queue-desktop-linux-amd64

  release-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/desktopui/frontend/package-lock.json

      - name: Build frontend
        working-directory: internal/desktopui/frontend
        run: npm ci && npm run build

      - name: Build CLI
        shell: bash
        run: |
          go build -ldflags "-s -w" \
            -o smart-redis-queue-cli-windows-amd64.exe \
            ./cmd/manager

      - name: Build desktop (opens UI on launch)
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euxo pipefail
          go build -tags wails,production \
            -ldflags "-s -w -H windowsgui" \
            -o smart-redis-queue-desktop-windows-amd64.exe \
            ./cmd/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-amd64
          path: |
            smart-redis-queue-cli-windows-amd64.exe
            smart-redis-queue-desktop-windows-amd64.exe

  release-macos:
    name: macOS arm64 + amd64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/desktopui/frontend/package-lock.json

      - name: Build frontend
        working-directory: internal/desktopui/frontend
        run: npm ci && npm run build

      - name: Build CLI (arm64 + amd64)
        run: |
          set -euxo pipefail
          go build -ldflags "-s -w" \
            -o smart-redis-queue-cli-darwin-arm64 \
            ./cmd/manager
          GOARCH=amd64 go build -ldflags "-s -w" \
            -o smart-redis-queue-cli-darwin-amd64 \
            ./cmd/manager

      - name: Build desktop darwin-arm64
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CGO_CFLAGS: '-mmacosx-version-min=12.0'
          CGO_LDFLAGS: '-mmacosx-version-min=12.0 -framework UniformTypeIdentifiers'
        run: |
          set -euxo pipefail
          go build -tags wails,production \
            -ldflags "-s -w" \
            -o smart-redis-queue-desktop-darwin-arm64 \
            ./cmd/desktop

      - name: Build desktop darwin-amd64 (cross from arm64 host)
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CGO_CFLAGS: '-mmacosx-version-min=12.0 -arch x86_64'
          CGO_LDFLAGS: '-mmacosx-version-min=12.0 -arch x86_64 -framework UniformTypeIdentifiers'
        run: |
          set -euxo pipefail
          go build -tags wails,production \
            -ldflags "-s -w" \
            -o smart-redis-queue-desktop-darwin-amd64 \
            ./cmd/desktop 2>&1 | tee build-macos-amd64.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: darwin-amd64-build-log
          path: build-macos-amd64.log
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: darwin
          path: |
            smart-redis-queue-cli-darwin-arm64
            smart-redis-queue-cli-darwin-amd64
            smart-redis-queue-desktop-darwin-arm64
            smart-redis-queue-desktop-darwin-amd64

  release-android:
    name: Android APK (experimental)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/desktopui/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install wails3 + Task
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.31
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build frontend
        working-directory: internal/desktopui/frontend
        run: npm ci && npm run build

      - name: Build Android APK (fat)
        run: |
          set -euxo pipefail
          wails3 task android:package:fat
          ls -la bin/ || true
          find . -name '*.apk' | head -20

      - name: Rename APK
        run: |
          set -euxo pipefail
          APK=$(find bin -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" smart-redis-queue-android.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android
          path: smart-redis-queue-android.apk

  publish:
    name: GitHub Release
    needs: [release-linux, release-windows, release-macos, release-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Pack
        run: |
          set -euxo pipefail
          mkdir -p release
          cp dist/linux-amd64/smart-redis-queue-cli-linux-amd64 release/
          cp dist/linux-amd64/smart-redis-queue-desktop-linux-amd64 release/
          cp dist/windows-amd64/smart-redis-queue-cli-windows-amd64.exe release/
          cp dist/windows-amd64/smart-redis-queue-desktop-windows-amd64.exe release/
          cp dist/darwin/smart-redis-queue-cli-darwin-arm64 release/
          cp dist/darwin/smart-redis-queue-cli-darwin-amd64 release/
          cp dist/darwin/smart-redis-queue-desktop-darwin-arm64 release/
          cp dist/darwin/smart-redis-queue-desktop-darwin-amd64 release/
          cp dist/android/smart-redis-queue-android.apk release/
          chmod +x release/smart-redis-queue-* || true
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/smart-redis-queue-cli-linux-amd64
            release/smart-redis-queue-desktop-linux-amd64
            release/smart-redis-queue-cli-windows-amd64.exe
            release/smart-redis-queue-desktop-windows-amd64.exe
            release/smart-redis-queue-cli-darwin-arm64
            release/smart-redis-queue-cli-darwin-amd64
            release/smart-redis-queue-desktop-darwin-arm64
            release/smart-redis-queue-desktop-darwin-amd64
            release/smart-redis-queue-android.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
