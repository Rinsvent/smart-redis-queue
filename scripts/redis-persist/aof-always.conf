# Максимальная durability на одном узле: fsync после каждой записи до ответа клиенту.
# Publish/Ack, вернувшие OK, должны пережить kill -9 процесса Redis (не FS/диска целиком).
port 6379
bind 0.0.0.0
protected-mode no
save ""
appendonly yes
appendfilename appendonly.aof
appendfsync always
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
dir /data
